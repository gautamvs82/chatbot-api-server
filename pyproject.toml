[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot_api_server"
version = "0.1.0"
description = "A standard Python project structure template."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gautam Solanki", email = "gautamvs@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "psycopg>=3.3.5",
    "psycopg-binary>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

